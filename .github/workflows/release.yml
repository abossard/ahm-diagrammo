name: Release verification

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release tag and package artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          [[ "${RELEASE_TAG}" == "${expected_tag}" ]]
      - name: Install dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Run tests
        env:
          AHM_TEST_FONT_FILES: ./test/assets/fonts/unifont-18.0.01.otf,./test/assets/fonts/unifont_upper-18.0.01.otf
          AHM_TEST_FONT_SHA256: 88d0a14d4aa9a96419720b39ba5da921a59560d76d4ec7d523acc06ed85cd3c2,472201e45a050bff4c7658208b8c73e34ebce3764b287a5a46c7774038ef9391
          AHM_TEST_FONT_FAMILY: Unifont
        run: npm test
      - name: Pack artifact
        run: npm pack --json
